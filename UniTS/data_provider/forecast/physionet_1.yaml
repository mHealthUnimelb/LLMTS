task_dataset:
  physionet_1: # the dataset and task name
    task_name: long_term_forecast # the type of task
    dataset: physionet_1 # the name of the dataset
    data: custom_tensor # the data type of the dataset, use UEA if you use the '.ts' file
    embed: timeF # the embedding method used
    root_path: ./data/forecast/physionet_1 # the root path of the dataset
    features: M
    seq_len: 512 # the length of the input sequence
    label_len: 512 # the length of the label sequence, 0 for classification
    pred_len: 512 # the length of the predicted sequence, 0 for classification
    enc_in: 41 # the number of variable numbers
    dec_in: 41
    c_out: 41 # the output variable numbers, 0 for classification